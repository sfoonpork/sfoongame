<!DOCTYPE html>
<!--
  Pibb Game — static multiplayer browser game
  ==========================================
  Architecture:
    - Single-page app (no build step)
    - PeerJS (WebRTC) for P2P networking — see js/app.js
    - Canvas for world rendering; DOM for chat, leaderboard, and controls

  Layout (left → right):
    game-area: header bar + canvas + overlay leaderboard
    chat-sidebar: messages, player count, leave button
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pibb Game</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="pibble.png" type="image/png">
  <link rel="apple-touch-icon" href="pibble.png">
  <meta name="description" content="Pibb Game — free multiplayer browser game. Move, collect mulch, and chat with other players.">
  <meta name="google-adsense-account" content="ca-pub-9051438561139115">
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      wait_for_update: 500
    });
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9051438561139115"
     crossorigin="anonymous"></script>
</head>
<!-- body.in-room: full-viewport game layout (see style.css) -->
<body class="in-room">
  <main class="container" id="main">
    <section id="room" class="room-layout">
      <!-- ── Game column ───────────────────────────────────────────── -->
      <div class="game-area">
        <!-- Top bar: role badge, editable name, connection status, controls hint -->
        <div class="game-header">
          <div class="room-info">
            <span class="badge" id="role-badge">…</span>
            <h2>Pibb Game</h2>
          </div>
          <!-- Live-editable display name; synced over network in app.js -->
          <label class="player-name-field" for="player-name-input">
            <span class="player-name-label">Name</span>
            <input
              id="player-name-input"
              type="text"
              placeholder="Your name"
              maxlength="24"
              autocomplete="nickname"
              spellcheck="false"
              disabled
            >
          </label>
          <p id="connection-status" class="connection waiting">Connecting…</p>
          <p class="controls-hint">WASD/click move, drag to pan</p>
        </div>

        <!-- Canvas fills remaining space; leaderboard floats on top (pointer-events: none) -->
        <div class="game-body">
          <canvas id="game-canvas"></canvas>
          <aside class="leaderboard" id="leaderboard" aria-label="Mulch leaderboard">
            <h3 class="leaderboard-title">Mulch</h3>
            <!-- Populated by updateLeaderboard() in app.js -->
            <ol class="leaderboard-list" id="leaderboard-list"></ol>
          </aside>
        </div>
      </div>

      <!-- ── Chat column ───────────────────────────────────────────── -->
      <aside class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h3>Chat</h3>
          <span id="player-count" class="player-count">0 players</span>
        </div>
        <div id="messages" class="messages"></div>
        <form id="message-form" class="message-form">
          <input id="message-input" type="text" placeholder="Send a message…" disabled>
          <button type="submit" class="btn btn-secondary" disabled>Send</button>
        </form>
        <button id="leave-btn" class="btn btn-ghost">Leave Game</button>
        <nav class="site-links" aria-label="Site information">
          <a href="about.html">About</a>
          <span aria-hidden="true">·</span>
          <a href="privacy.html">Privacy</a>
          <span aria-hidden="true">·</span>
          <a href="terms.html">Terms</a>
        </nav>
      </aside>
    </section>
  </main>

  <div id="consent-banner" class="consent-banner hidden" role="dialog" aria-labelledby="consent-title" aria-hidden="true">
    <div class="consent-banner-inner">
      <p id="consent-title">
        We use cookies for advertising through Google AdSense.
        <a href="privacy.html">Privacy Policy</a>
      </p>
      <div class="consent-banner-actions">
        <button type="button" id="consent-reject" class="btn btn-secondary">Reject</button>
        <button type="button" id="consent-accept" class="btn btn-primary">Accept</button>
      </div>
    </div>
  </div>

  <script src="js/consent.js"></script>
  <!-- PeerJS: WebRTC signaling + data channels (vendored) -->
  <script src="js/peerjs.min.js"></script>
  <!-- All game logic, networking, and rendering -->
  <script src="js/app.js"></script>
</body>
</html>
